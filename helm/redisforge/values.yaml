replicaCount: 1

image:
  repository: redisforge
  tag: latest
  pullPolicy: IfNotPresent

service:
  # ClusterIP keeps this TCP database private inside the cluster by default.
  type: ClusterIP
  port: 6379
  # Only used when service.type is NodePort.
  nodePort: ""

persistence:
  # When enabled, the chart turns on AOF and stores it on a PVC.
  enabled: false
  size: 1Gi
  storageClassName: ""

podSecurityContext:
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL

resources: {}
