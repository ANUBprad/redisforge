name: ci

# Continuous integration: test, validate the Docker and Helm artefacts, and - on a
# push to main or a version tag - publish a versioned image to the GitHub Container
# Registry. Pull requests never publish anything.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    # A change that touches only prose or docs cannot alter the build, so it does not
    # start one. Path filters are not evaluated for tag pushes, so a release always
    # builds. Pull requests always run the full workflow.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

# Least privilege by default: every job can read the source and nothing else. The
# publish job widens this for itself only.
permissions:
  contents: read

concurrency:
  group: redisforge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '23'

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # verify runs the whole test suite and packages the single-jar application, so
      # the artefact that is tested is the artefact an image would run.
      - name: Run the test suite and package
        run: mvn -B -ntp clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore

  helm:
    name: helm
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint the Helm chart
        run: helm lint helm/redisforge

      - name: Render Kubernetes manifests
        run: helm template redisforge helm/redisforge --namespace redisforge

  # A pull request builds the image but never pushes it, so a Dockerfile that stopped
  # working fails the pull request while nothing is published from untrusted code.
  image-build:
    name: image (build only)
    if: github.event_name == 'pull_request'
    needs: [ test ]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the container image without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # On main and on a version tag the tested image is published to GHCR. Every build is
  # tagged with the full commit SHA as well as any human-readable tag, so a deployment
  # can always name the exact image a green build produced.
  publish:
    name: publish
    if: github.event_name != 'pull_request'
    needs: [ test, helm ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Lowercase the image name
        # GHCR requires a lowercase repository path; github.repository keeps the
        # original casing.
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push the container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise the published image
        run: |
          {
            echo "### Published image"
            echo ""
            echo "**Primary tag (immutable):** \`${{ env.IMAGE_NAME }}:sha-${{ github.sha }}\`"
            echo ""
            echo "All tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
