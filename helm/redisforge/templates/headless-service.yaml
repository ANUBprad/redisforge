apiVersion: v1
kind: Service
metadata:
  name: {{ include "redisforge.fullname" . }}-headless
  labels:
    {{- include "redisforge.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: redis
      port: {{ .Values.service.port }}
      targetPort: redis
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "redisforge.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
