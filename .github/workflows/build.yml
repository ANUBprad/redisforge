name: build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: redisforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Run the test suite
        run: mvn -B clean test

      - name: Package the jar
        run: mvn -B package -DskipTests

      - name: Build the container image
        run: docker build --tag redisforge:ci .

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint the Helm chart
        run: helm lint helm/redisforge

      - name: Render Kubernetes manifests
        run: helm template redisforge helm/redisforge --namespace redisforge

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
